# Pipeline definition: versioned with the code, no secrets.
# Deployment values (STORAGE_URI, credentials, MLflow) live in .env, see .env.example.

# Coordinates are needed for the Open-Meteo forecast request.
# To switch station, change this block; nothing else in the code is station-specific.
station:
  id: BALRD
  name: Balruddery
  latitude: 56.482297
  longitude: -3.1114881

cosmos:
  base_url: https://cosmos-api.ceh.ac.uk
  collection: 1D                  # daily data; 30M is the 30-minute collection
  parameters: [cosmos_vwc, precip, ta, rh, stp_tsoil20]
  backfill_start: 2023-01-01      # BALRD goes back to 2014; an earlier start is possible
  refetch_days: 7                 # every ingest re-fetches this many days (provider corrections)

openmeteo:
  # Previous Runs API: forecasts at a fixed lead time (1, 2, ... days before the hour they forecast).
  previous_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  archive_start: 2024-02-05       # first date with a precip_fc_gap_sum value (review B); earlier dates come back empty

features:
  version: v1                     # bump when a feature definition changes
  issue_gap: 2                    # target d uses observations through d-2

# Plausible physical ranges [min, max]. Values outside become NaN in the clean table.
ranges:
  cosmos_vwc: [0, 100]
  precip: [0, 300]
  ta: [-30, 45]
  rh: [0, 100]
  stp_tsoil20: [-10, 40]

training:
  # Windows by target date (README: model selection rule). The test window is never
  # used to choose or tune a model; its MAE is only logged for the promoted champion.
  train_start: 2023-01-01
  train_end: 2024-12-31
  val_start: 2025-01-01
  val_end: 2025-12-31
  test_start: 2026-01-01
  test_end: 2026-10-01
  experiment: soil-moisture-balrd
  model_name: soil-moisture-balrd   # registry name; the champion has the alias "champion"
  lightgbm:                         # fixed, not tuned: tuning on 2025 would need another window
    objective: regression_l1        # optimise the metric we report (MAE)
    num_boost_round: 300
    learning_rate: 0.03
    num_leaves: 15
    min_data_in_leaf: 20
    seed: 42
    deterministic: true             # with num_threads 1: same snapshot, same model
    num_threads: 1
    verbose: -1
