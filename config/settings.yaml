# Pipeline definition: versioned with the code, no secrets.
# Deployment values (STORAGE_URI, credentials, MLflow) live in .env, see .env.example.

# Coordinates are needed for the Open-Meteo forecast request.
# To switch station, change this block; nothing else in the code is station-specific.
station:
  id: BALRD
  name: Balruddery
  latitude: 56.482297
  longitude: -3.1114881

cosmos:
  base_url: https://cosmos-api.ceh.ac.uk
  collection: 1D                  # daily data; 30M is the 30-minute collection
  parameters: [cosmos_vwc, precip, ta, rh, stp_tsoil20]
  backfill_start: 2023-01-01      # BALRD goes back to 2014; an earlier start is possible
  refetch_days: 7                 # every ingest re-fetches this many days (provider corrections)

openmeteo:
  # Previous Runs API: forecasts at a fixed lead time (1, 2, ... days before the hour they forecast).
  previous_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  archive_start: 2024-01-01       # earlier dates come back empty (checked: data from ~Mar 2024)

features:
  version: v1                     # bump when a feature definition changes
  issue_gap: 2                    # target d uses observations through d-2

# Plausible physical ranges [min, max]. Values outside become NaN in the clean table.
ranges:
  cosmos_vwc: [0, 100]
  precip: [0, 300]
  ta: [-30, 45]
  rh: [0, 100]
  stp_tsoil20: [-10, 40]
