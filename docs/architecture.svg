<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="660" viewBox="0 0 1220 660" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 10; }
      .t { font-size: 17px; font-weight: 700; fill: #1f2933; }
      .s { font-size: 13px; fill: #3e4c59; }
      .line { stroke: #4a5568; stroke-width: 1.6; fill: none; stroke-linejoin: round; marker-end: url(#arr); }
      .lbl { font-size: 12px; fill: #52606d; }
      .lbl-c { font-size: 12px; fill: #52606d; text-anchor: middle; }
      .pill { fill: #fafbfc; }
    </style>
  </defs>

  <rect width="1220" height="660" fill="#fafbfc"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2933">Soil moisture forecasting: FTI architecture</text>
  <text x="40" y="70" class="s">Station BALRD (COSMOS-UK). A forecast is issued on day D with data through D−1; the target is the daily mean soil moisture of D+1.</text>

  <!-- orchestration -->
  <rect x="300" y="95" width="860" height="70" class="box" fill="#eef0f3" stroke="#24292f"/>
  <text x="320" y="124" class="t">GitHub Actions</text>
  <text x="320" y="148" class="s">Schedules the pipelines and runs CI (tests on every push). Every job runs in the same Docker image, pinned deps (uv.lock).</text>

  <!-- data sources -->
  <rect x="40" y="215" width="200" height="57" class="box" fill="#eef6ff" stroke="#3b82c4"/>
  <text x="56" y="240" class="t">COSMOS-UK API</text>
  <text x="56" y="261" class="s">daily soil + weather obs.</text>

  <rect x="40" y="288" width="200" height="57" class="box" fill="#eef6ff" stroke="#3b82c4"/>
  <text x="56" y="313" class="t">Open-Meteo</text>
  <text x="56" y="334" class="s">rain forecasts, as issued</text>

  <!-- pipelines -->
  <rect x="300" y="215" width="220" height="130" class="box" fill="#e9f7ee" stroke="#2f9e5b"/>
  <text x="318" y="245" class="t">1. Feature pipeline</text>
  <text x="318" y="271" class="s">backfill from 2023,</text>
  <text x="318" y="290" class="s">daily ingest</text>
  <text x="318" y="309" class="s">validate, clean, upsert</text>
  <text x="318" y="328" class="s">build shared features</text>

  <rect x="620" y="215" width="220" height="130" class="box" fill="#fff1e6" stroke="#d9731f"/>
  <text x="638" y="245" class="t">2. Training pipeline</text>
  <text x="638" y="271" class="s">LightGBM vs. persistence</text>
  <text x="638" y="290" class="s">champion chosen on</text>
  <text x="638" y="309" class="s">validation data only</text>

  <rect x="940" y="215" width="220" height="130" class="box" fill="#fdecef" stroke="#c2415a"/>
  <text x="958" y="245" class="t">3. Inference pipeline</text>
  <text x="958" y="271" class="s">daily forecast for D+1</text>
  <text x="958" y="290" class="s">forecasts stored on GCS</text>

  <!-- storage and UI -->
  <rect x="40" y="430" width="480" height="165" class="box" fill="#fff8e6" stroke="#c99a1e"/>
  <text x="58" y="460" class="t">Feature store: versioned Parquet on GCS</text>
  <text x="58" y="487" class="s" font-family="DejaVu Sans Mono, monospace">raw/</text><text x="232" y="487" class="s">API responses, never modified</text>
  <text x="58" y="509" class="s" font-family="DejaVu Sans Mono, monospace">clean/</text><text x="232" y="509" class="s">observations + forecasts per date</text>
  <text x="58" y="531" class="s" font-family="DejaVu Sans Mono, monospace">features/v1/</text><text x="232" y="531" class="s">one row per target date</text>
  <text x="58" y="553" class="s" font-family="DejaVu Sans Mono, monospace">features/latest.json</text><text x="232" y="553" class="s">current version</text>
  <text x="58" y="575" class="s" font-family="DejaVu Sans Mono, monospace">issued/v1/</text><text x="232" y="575" class="s">inference row frozen at issue time</text>

  <rect x="620" y="430" width="220" height="110" class="box" fill="#eef0fd" stroke="#4f5bd5"/>
  <text x="638" y="460" class="t">Model registry</text>
  <text x="638" y="486" class="s">MLflow on DagsHub</text>
  <text x="638" y="505" class="s">experiments + versions</text>

  <rect x="990" y="430" width="190" height="110" class="box" fill="#f3effc" stroke="#7a5cc4"/>
  <text x="1006" y="460" class="t">Dashboard</text>
  <text x="1006" y="486" class="s">Streamlit on HF Spaces</text>
  <text x="1006" y="505" class="s">forecasts vs.</text>
  <text x="1006" y="524" class="s">observations</text>

  <!-- schedules -->
  <path d="M410,165 V215" class="line"/>
  <text x="418" y="195" class="lbl">daily</text>
  <path d="M730,165 V215" class="line"/>
  <text x="738" y="195" class="lbl">weekly</text>
  <path d="M1050,165 V215" class="line"/>
  <text x="1058" y="195" class="lbl">daily</text>

  <!-- data flow: orthogonal, each arrow ends on a box edge -->
  <path d="M240,243 H300" class="line"/>
  <path d="M240,316 H300" class="line"/>

  <path d="M410,345 V430" class="line"/>
  <text x="418" y="392" class="lbl">write</text>

  <path d="M520,485 H562 Q570,485 570,477 V288 Q570,280 578,280 H620" class="line"/>
  <rect x="528" y="373" width="84" height="18" rx="9" class="pill"/>
  <text x="570" y="386" class="lbl-c">read features</text>

  <path d="M730,345 V430" class="line"/>
  <text x="738" y="392" class="lbl">register</text>

  <path d="M840,485 H882 Q890,485 890,477 V288 Q890,280 898,280 H940" class="line"/>
  <rect x="853" y="373" width="74" height="18" rx="9" class="pill"/>
  <text x="890" y="386" class="lbl-c">load model</text>

  <path d="M410,595 V622 Q410,630 418,630 H957 Q965,630 965,622 V345" class="line"/>
  <text x="690" y="622" class="lbl-c">latest features</text>

  <path d="M1085,345 V430" class="line"/>
  <text x="1093" y="392" class="lbl">forecasts</text>
</svg>
