<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; rx: 10; }
      .src { fill: #eef6ff; stroke: #3b82c4; }
      .done { fill: #e9f7ee; stroke: #2f9e5b; stroke-width: 2.5; }
      .store { fill: #fff8e6; stroke: #c99a1e; stroke-width: 2.5; }
      .later { fill: #f4f4f6; stroke: #9aa0aa; stroke-dasharray: 6 4; }
      .t { font-size: 17px; font-weight: 700; fill: #1f2933; }
      .s { font-size: 13px; fill: #3e4c59; }
      .tag { font-size: 12px; font-weight: 700; }
      .line { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .dash { stroke-dasharray: 6 4; }
      .lbl { font-size: 12px; fill: #52606d; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#fafbfc"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2933">Soil moisture forecasting: FTI architecture</text>
  <text x="40" y="70" class="s">Station BALRD (COSMOS-UK). Forecast issued on day D with data through D-1; target = daily mean soil moisture of D+1.</text>

  <!-- sources -->
  <rect x="40" y="120" width="240" height="90" class="box src"/>
  <text x="60" y="152" class="t">COSMOS-UK API</text>
  <text x="60" y="176" class="s">daily soil + weather obs.</text>
  <text x="60" y="196" class="s">updated once a day</text>

  <rect x="40" y="250" width="240" height="90" class="box src"/>
  <text x="60" y="282" class="t">Open-Meteo</text>
  <text x="60" y="306" class="s">Previous Runs API: rain forecast</text>
  <text x="60" y="326" class="s">made 1 and 2 days ahead</text>

  <!-- feature pipeline -->
  <rect x="350" y="110" width="290" height="240" class="box done"/>
  <text x="370" y="142" class="t">1. Feature pipeline</text>
  <text x="560" y="142" class="tag" fill="#2f9e5b">MS2</text>
  <text x="370" y="170" class="s">backfill (2023 →), ingest (last 7 days)</text>
  <text x="370" y="192" class="s">forecast snapshot (as issued)</text>
  <text x="370" y="214" class="s">validate, upsert by date</text>
  <text x="370" y="236" class="s">build_feature_rows() — shared</text>
  <text x="370" y="258" class="s">  feature definitions (common/)</text>
  <text x="370" y="290" class="s">GitHub Actions cron, runs in</text>
  <text x="370" y="310" class="s">the Docker image</text>

  <!-- feature store -->
  <rect x="710" y="110" width="440" height="240" class="box store"/>
  <text x="730" y="142" class="t">Feature store: versioned Parquet on GCS</text>
  <text x="730" y="172" class="s" font-family="DejaVu Sans Mono, monospace">raw/</text><text x="915" y="172" class="s">API responses, never modified</text>
  <text x="730" y="194" class="s" font-family="DejaVu Sans Mono, monospace">clean/</text><text x="915" y="194" class="s">observations + forecasts per date</text>
  <text x="730" y="216" class="s" font-family="DejaVu Sans Mono, monospace">features/v1/</text><text x="915" y="216" class="s">one row per target date</text>
  <text x="730" y="238" class="s" font-family="DejaVu Sans Mono, monospace">features/latest.json</text><text x="915" y="238" class="s">current version</text>
  <text x="730" y="260" class="s" font-family="DejaVu Sans Mono, monospace">issued/v1/</text><text x="915" y="260" class="s">inference row frozen at issue time</text>
  <text x="730" y="292" class="s">same code on ./data locally (fsspec);</text>
  <text x="730" y="312" class="s">bucket object versioning on</text>

  <!-- later -->
  <rect x="350" y="430" width="290" height="110" class="box later"/>
  <text x="370" y="462" class="t">2. Training pipeline</text>
  <text x="560" y="462" class="tag" fill="#7b8794">MS3</text>
  <text x="370" y="488" class="s">LightGBM, weekly retrain</text>
  <text x="370" y="510" class="s">select on validation only</text>

  <rect x="710" y="430" width="200" height="110" class="box later"/>
  <text x="730" y="462" class="t">MLflow (DagsHub)</text>
  <text x="730" y="488" class="s">experiments +</text>
  <text x="730" y="510" class="s">model registry</text>

  <rect x="950" y="430" width="200" height="110" class="box later"/>
  <text x="970" y="462" class="t">3. Inference</text>
  <text x="1105" y="462" class="tag" fill="#7b8794">MS4</text>
  <text x="970" y="488" class="s">daily forecast +</text>
  <text x="970" y="510" class="s">Streamlit dashboard</text>

  <!-- arrows -->
  <path d="M280,165 L345,190" class="line"/>
  <path d="M280,295 L345,270" class="line"/>
  <path d="M640,230 L705,230" class="line"/>
  <text x="648" y="220" class="lbl">write</text>
  <path d="M820,350 L560,425" class="line dash"/>
  <text x="465" y="420" class="lbl">read features</text>
  <path d="M640,485 L705,485" class="line dash"/>
  <text x="648" y="475" class="lbl">register</text>
  <path d="M910,485 L945,485" class="line dash"/>
  <path d="M1050,350 L1050,425" class="line dash"/>
  <text x="1058" y="395" class="lbl">read latest row</text>

  <!-- legend -->
  <rect x="40" y="585" width="18" height="14" fill="#e9f7ee" stroke="#2f9e5b" stroke-width="2"/>
  <text x="66" y="597" class="s">built (MS2)</text>
  <rect x="170" y="585" width="18" height="14" fill="#f4f4f6" stroke="#9aa0aa" stroke-dasharray="4 3"/>
  <text x="196" y="597" class="s">planned (MS3 / MS4)</text>
</svg>
