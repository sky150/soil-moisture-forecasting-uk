# Tests and Docker build on every push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.9"
      - name: Install (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Tests (no network, no credentials)
        run: uv run pytest -v
      - name: Docker build
        run: docker build -t soil-pipeline .
